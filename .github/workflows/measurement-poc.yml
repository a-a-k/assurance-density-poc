name: Existing-artifact semantic assessment

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Infrastructure pilot or full fixed cohort
        options: [exposure_audit, exposure_measure, replay_audit, planned_audit, planned_measure, warrant_audit, warrant_measure, post_measure, post_format, author_only, unit_screen, post_screen, screen, pilot, full]
        default: pilot
      source_run:
        type: string
        description: Author-only audit comparison RUN-ATTEMPT
      source_sha:
        type: string
        description: Author-only audit full comparison source SHA
      source_seed:
        type: string
        description: Author-only audit comparison seed
      source_protocol:
        type: string
        description: Author-only audit protocol, legacy, warrant or planned
      source_treatment:
        type: string
        description: Author-only audit treatment, structured, warrant or obligation_plan
      source_shard:
        type: string
        description: Author-only audit shard; only0 may supply a global prefix
      evaluation_policy:
        type: choice
        description: Timing policy for planned_measure; relative requires calibration review
        options: [fixed-v1, relative-v1]
        default: fixed-v1

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      cases: ${{ steps.cases.outputs.value }}
    steps:
      - id: cases
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          mode = os.environ['MODE']
          seeds = [11,29,47] if mode in ('full','post_measure','warrant_audit','warrant_measure','planned_audit','planned_measure','exposure_audit','exposure_measure') else [11]
          shards = range(6) if mode == 'exposure_measure' else range(4) if mode == 'planned_measure' else [None]
          cases = [{'seed': seed, 'shard': shard if shard is not None else '',
                    'key': f'seed-{seed}' + (f'-shard-{shard}' if shard is not None else '')}
                   for seed in seeds for shard in shards]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('value=' + json.dumps({'include': cases}) + '\n')
          PY
  compare:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.prepare.outputs.cases) }}
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate harness invariants
        run: |
          python -m unittest discover -s measurement_poc -p 'test_*.py' -v
          python -m unittest discover -s postcondition_poc -p 'test_*.py' -v
      - name: Install finite replay numeric comparator
        if: inputs.mode == 'post_measure' || inputs.mode == 'author_only' || inputs.mode == 'warrant_measure' || inputs.mode == 'planned_measure' || inputs.mode == 'replay_audit' || inputs.mode == 'exposure_measure' || inputs.mode == 'exposure_audit'
        run: python -m pip install numpy==1.26.4
      - name: Start pinned CPU model
        if: inputs.mode == 'pilot' || inputs.mode == 'full' || inputs.mode == 'post_measure' || inputs.mode == 'post_format' || inputs.mode == 'warrant_audit' || inputs.mode == 'warrant_measure' || inputs.mode == 'planned_audit' || inputs.mode == 'planned_measure' || inputs.mode == 'exposure_audit' || inputs.mode == 'exposure_measure'
        run: python -u measurement_poc/bootstrap.py
      - name: Assess unchanged published assertions
        id: experiment
        env:
          MODE: ${{ inputs.mode }}
          SEED: ${{ matrix.seed }}
          SHARD: ${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SEED: ${{ inputs.source_seed }}
          SOURCE_PROTOCOL: ${{ inputs.source_protocol }}
          SOURCE_TREATMENT: ${{ inputs.source_treatment }}
          SOURCE_SHARD: ${{ inputs.source_shard }}
          EVALUATION_POLICY: ${{ inputs.evaluation_policy }}
        run: |
          set -o pipefail
          mkdir -p ci-logs
          if [ "$MODE" = exposure_audit ]; then
            python -u postcondition_poc/exposure_audit.py --seed "$SEED" 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = exposure_measure ]; then
            python -u postcondition_poc/exposure_runner.py --seed "$SEED" --shard "$SHARD" 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = replay_audit ]; then
            python -u postcondition_poc/replay_audit.py 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = planned_audit ]; then
            python -u postcondition_poc/planned_audit.py --seed "$SEED" 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = planned_measure ]; then
            python -u postcondition_poc/measurement.py --seed "$SEED" --protocol planned --evaluation-policy "$EVALUATION_POLICY" --shard "$SHARD" 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = warrant_audit ]; then
            python -u postcondition_poc/warrant_audit.py --seed "$SEED" 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = warrant_measure ]; then
            python -u postcondition_poc/measurement.py --seed "$SEED" --protocol warrant 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = post_format ]; then
            python -u postcondition_poc/format_audit.py 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = author_only ]; then
            shard_args=()
            if [ -n "$SOURCE_SHARD" ]; then shard_args=(--source-shard "$SOURCE_SHARD"); fi
            python -u postcondition_poc/author_only.py --source-run "$SOURCE_RUN" --source-sha "$SOURCE_SHA" --seed "$SOURCE_SEED" --protocol "$SOURCE_PROTOCOL" --treatment "$SOURCE_TREATMENT" "${shard_args[@]}" 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = post_measure ]; then
            python -u postcondition_poc/measurement.py --seed "$SEED" 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = unit_screen ]; then
            python -u postcondition_poc/unit_screen.py 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = post_screen ]; then
            python -u postcondition_poc/screen.py 2>&1 | tee ci-logs/measurement-run.log
          elif [ "$MODE" = screen ]; then
            python -u measurement_poc/screen.py 2>&1 | tee ci-logs/measurement-run.log
          else
            python -u measurement_poc/run.py --mode "$MODE" --seed "$SEED" 2>&1 | tee ci-logs/measurement-run.log
          fi
      - name: Archive exact inputs, responses, outcomes and costs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_KEY: ${{ matrix.key }}
          ARCHIVE_DIRS: inputs/measurement,results/measurement,ci-logs,results/simple_summary.md
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: python persist_results.py
