name: Four-package PoC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: requests-poc-results
      cancel-in-progress: false
    env:
      EXPECTED_SHA: ${{ github.sha }}
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.9.13'
      - name: Install packages
        shell: bash
        run: |
          mkdir ci-logs
          python -m pip install pip==24.3.1 2>&1 | tee ci-logs/dependencies.log
          python -m pip install --only-binary=:all: -r requirements-poc.txt 2>&1 | tee -a ci-logs/dependencies.log
          python -m pip install --only-binary=:all: --no-deps --target vendor/2.19.1 requests==2.19.1 2>&1 | tee -a ci-logs/dependencies.log
          python -m pip install --only-binary=:all: --no-deps --target vendor/2.20.0 requests==2.20.0 2>&1 | tee -a ci-logs/dependencies.log
      - name: Compare four suites and run their maintenance update
        id: experiment
        run: python run_ci.py --simple-only
      - name: Save the result table, runnable suites and logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: python persist_results.py
