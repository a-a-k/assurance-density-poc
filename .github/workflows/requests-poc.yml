name: Requests frozen-input PoC

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA to reproduce (must equal the selected ref)
        required: true
        type: string

permissions:
  contents: read

jobs:
  reproduce:
    # Exact historical interpreter build is available for this runner image.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify dispatch identity and clean output directory
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -e results
          mkdir ci-logs
          git status --porcelain > ci-logs/initial-git-status.txt
          test ! -s ci-logs/initial-git-status.txt

      - name: Set up the fixed interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.9.13'
          architecture: x64

      - name: Install pinned packages and isolated historical versions
        shell: bash
        run: |
          python -m pip install pip==24.3.1 2>&1 | tee ci-logs/dependencies.log
          python -m pip install --only-binary=:all: -r requirements.txt 2>&1 | tee -a ci-logs/dependencies.log
          python -m pip install --only-binary=:all: --no-deps --target vendor/2.19.1 requests==2.19.1 2>&1 | tee -a ci-logs/dependencies.log
          python -m pip install --only-binary=:all: --no-deps --target vendor/2.20.0 requests==2.20.0 2>&1 | tee -a ci-logs/dependencies.log
          python -m pip freeze --all > ci-logs/pip-freeze.txt

      - name: Measure, freeze selections, evaluate, and verify
        shell: bash
        run: python run_ci.py

      - name: Preserve results and diagnostics from every attempt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: requests-poc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            ci-logs/
            inputs/
          if-no-files-found: error
          retention-days: 90
