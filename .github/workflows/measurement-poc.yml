name: Existing-artifact semantic assessment

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Infrastructure pilot or full fixed cohort
        options: [screen, pilot, full]
        default: pilot

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      seeds: ${{ steps.seeds.outputs.value }}
    steps:
      - id: seeds
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = full ]; then
            echo 'value=[11,29,47]' >> "$GITHUB_OUTPUT"
          else
            echo 'value=[11]' >> "$GITHUB_OUTPUT"
          fi
  compare:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: ${{ fromJSON(needs.prepare.outputs.seeds) }}
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate harness invariants
        run: python -m unittest discover -s measurement_poc -p 'test_*.py' -v
      - name: Start pinned CPU model
        if: inputs.mode != 'screen'
        run: python -u measurement_poc/bootstrap.py
      - name: Assess unchanged published assertions
        id: experiment
        env:
          MODE: ${{ inputs.mode }}
          SEED: ${{ matrix.seed }}
        run: |
          set -o pipefail
          mkdir -p ci-logs
          if [ "$MODE" = screen ]; then
            python -u measurement_poc/screen.py 2>&1 | tee ci-logs/measurement-run.log
          else
            python -u measurement_poc/run.py --mode "$MODE" --seed "$SEED" 2>&1 | tee ci-logs/measurement-run.log
          fi
      - name: Archive exact inputs, responses, outcomes and costs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_KEY: seed-${{ matrix.seed }}
          ARCHIVE_DIRS: inputs/measurement,results/measurement,ci-logs,results/simple_summary.md
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: python persist_results.py
