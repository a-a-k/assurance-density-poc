name: Real grader adequacy PoC

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'Comparison, repair replay, or policy-scoped probe comparison'
        options: [compare, repair, scoped]
        default: compare
      source_run:
        description: 'Optional completed comparison run ID: replay accepted cases against a repaired checker'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: requests-poc-results
      cancel-in-progress: false
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: harbor-framework/terminal-bench
          ref: 1dcda8716784493721921c23e4bc7f7d988b4494
          path: external/terminal-bench
          sparse-checkout: tasks/cargo-flight-dispatch
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FikriAlfaraby/oracle-mutants
          ref: 7c67954b678c4a1c7670174ffacb1e772a8c84a3
          path: external/oracle-mutants
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the real baseline and Harbor
        run: |
          mkdir -p ci-logs
          python -m pip install harbor==0.24.0 ./external/oracle-mutants 2>&1 | tee ci-logs/grader-dependencies.log
          python -m pip freeze > ci-logs/grader-packages.txt
          docker version > ci-logs/docker.txt
      - name: Compare actual AST audit and generic output probes
        id: experiment
        if: inputs.mode == 'compare'
        run: python -u grader_poc/run.py 2>&1 | tee ci-logs/grader-run.log
      - name: Verify checker repair against every previously accepted candidate
        id: repair
        if: inputs.mode == 'repair'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python -u grader_poc/repair.py 2>&1 | tee ci-logs/repair-run.log
      - name: Compare automatic policy-scoped probes and cheap composite baseline
        id: scoped
        if: inputs.mode == 'scoped'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python -u grader_poc/scoped.py 2>&1 | tee ci-logs/scoped-run.log
      - name: Archive outputs, counterexamples and logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT_OUTCOME: ${{ inputs.mode == 'compare' && steps.experiment.outcome || inputs.mode == 'repair' && steps.repair.outcome || steps.scoped.outcome }}
        run: python persist_results.py
